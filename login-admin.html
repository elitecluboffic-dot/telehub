<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – TeleBoard</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --card: #1c2333; --border: #30363d;
      --accent: #2196f3; --text: #e6edf3; --muted: #8b949e;
      --green: #3fb950; --danger: #f85149; --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    /* subtle grid bg */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(33,150,243,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(33,150,243,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .login-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
    }

    .login-logo {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 32px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem; font-weight: 700; color: var(--accent);
      text-decoration: none;
    }
    .login-logo svg { width: 36px; height: 36px; }
    .login-logo .badge {
      background: rgba(33,150,243,.12); color: var(--accent);
      font-size: 0.68rem; font-weight: 700;
      padding: 2px 10px; border-radius: 99px; letter-spacing: .6px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 8px 40px rgba(0,0,0,.4);
    }

    .login-card h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem; font-weight: 700;
      margin-bottom: 6px;
    }
    .login-card p {
      color: var(--muted); font-size: 0.84rem; margin-bottom: 28px;
    }

    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 0.8rem; font-weight: 500;
      color: var(--muted); margin-bottom: 7px; letter-spacing: .3px;
    }
    .field-wrap { position: relative; }
    .field input {
      width: 100%; background: var(--card);
      border: 1px solid var(--border);
      color: var(--text); padding: 11px 42px 11px 14px;
      border-radius: 9px; font-family: 'Inter', sans-serif;
      font-size: 0.92rem; outline: none; transition: border-color .2s;
    }
    .field input:focus { border-color: var(--accent); }
    .field input.error { border-color: var(--danger); }

    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1rem; padding: 0;
      transition: color .2s; line-height: 1;
    }
    .toggle-pw:hover { color: var(--text); }

    .notice {
      padding: 10px 14px; border-radius: 8px;
      font-size: 0.8rem; margin-bottom: 18px; display: none;
    }
    .notice.info  { background: rgba(33,150,243,.1); color: #63b3ff; border: 1px solid rgba(33,150,243,.2); }
    .notice.error { background: rgba(248,81,73,.08); color: var(--danger); border: 1px solid rgba(248,81,73,.2); }
    .notice.show  { display: block; }

    .btn-login {
      width: 100%; padding: 12px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 9px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: background .2s, opacity .2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 6px;
    }
    .btn-login:hover:not(:disabled) { background: #1a7fd4; }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer {
      text-align: center; margin-top: 20px;
      font-size: 0.75rem; color: var(--muted);
    }
    .login-footer a { color: var(--accent); text-decoration: none; }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="login-wrap">
  <a href="index.html" class="login-logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="16" fill="#2196f3"/>
      <path d="M7 16.5l3.5 3.5 9-9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 10l-8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    TeleBoard <span class="badge">ADMIN</span>
  </a>

  <div class="login-card">
    <h1>🛡️ Masuk sebagai Admin</h1>
    <p>Akses terbatas — hanya untuk administrator TeleBoard.</p>

    <div class="notice" id="notice"></div>

    <div class="field">
      <label for="username">Username</label>
      <div class="field-wrap">
        <input type="text" id="username" placeholder="admin" autocomplete="username" spellcheck="false"/>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="field-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" id="password"/>
        <button class="toggle-pw" type="button" onclick="togglePw()" title="Tampilkan/sembunyikan password">👁</button>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Masuk ke Panel Admin</span>
    </button>
  </div>

  <div class="login-footer">
    <a href="index.html">← Kembali ke TeleBoard</a>
  </div>
</div>

<script>
  /* ─── KONFIGURASI ───────────────────────────────────────────
     Ganti ADMIN_USER dan ADMIN_PASS sesuai kredensial kamu.
     JWT_SECRET harus sama persis dengan di backend api_news.php.
  ─────────────────────────────────────────────────────────── */
  const ADMIN_USER   = 'admin';
  const ADMIN_PASS   = 'Labibganteng11';          // ganti password di sini
  const JWT_SECRET   = 'BUSTANUL_LABIB_ALWASI';   // harus sama dengan backend
  const TOKEN_TTL    = 8 * 60 * 60;               // 8 jam (detik)
  const REDIRECT_TO  = 'admin/dashboard-admin.html';  // halaman tujuan setelah login

  /* ─── NOTICE ─── */
  function showNotice(msg, type = 'error') {
    const el = document.getElementById('notice');
    el.textContent = msg;
    el.className = `notice ${type} show`;
  }
  function hideNotice() {
    document.getElementById('notice').className = 'notice';
  }

  /* ─── TOGGLE PASSWORD ─── */
  function togglePw() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  /* ─── JWT BUILDER (HMAC-SHA256, Web Crypto API) ─── */
  function b64url(str) {
    return btoa(String.fromCharCode(...new Uint8Array(str)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  async function buildJwt(payload, secret) {
    const enc   = new TextEncoder();
    const key   = await crypto.subtle.importKey(
      'raw', enc.encode(secret),
      { name: 'HMAC', hash: 'SHA-256' },
      false, ['sign']
    );
    const header  = b64url(enc.encode(JSON.stringify({ alg: 'HS256', typ: 'JWT' })));
    const body    = b64url(enc.encode(JSON.stringify(payload)));
    const sig     = await crypto.subtle.sign('HMAC', key, enc.encode(`${header}.${body}`));
    return `${header}.${body}.${b64url(sig)}`;
  }

  /* ─── LOGIN ─── */
  async function doLogin() {
    hideNotice();
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;

    if (!user || !pass) {
      showNotice('Username dan password wajib diisi.');
      return;
    }

    // Set loading state
    const btn     = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    btn.disabled      = true;
    spinner.style.display = 'block';
    btnText.textContent   = 'Memverifikasi...';

    // Simulasi delay kecil supaya tidak instan (anti-brute force feel)
    await new Promise(r => setTimeout(r, 600));

    if (user !== ADMIN_USER || pass !== ADMIN_PASS) {
      showNotice('Username atau password salah.');
      btn.disabled      = false;
      spinner.style.display = 'none';
      btnText.textContent   = 'Masuk ke Panel Admin';
      document.getElementById('password').classList.add('error');
      setTimeout(() => document.getElementById('password').classList.remove('error'), 1500);
      return;
    }

    // Buat JWT
    const now   = Math.floor(Date.now() / 1000);
    const token = await buildJwt(
      { sub: 'admin', admin: true, iat: now, exp: now + TOKEN_TTL },
      JWT_SECRET
    );

    localStorage.setItem('admin_token', token);

    btnText.textContent = '✅ Berhasil! Mengalihkan...';
    setTimeout(() => { window.location.href = REDIRECT_TO; }, 700);
  }

  /* ─── ENTER KEY ─── */
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  /* ─── CEK JIKA SUDAH LOGIN ─── */
  (function checkAlreadyLoggedIn() {
    const token = localStorage.getItem('admin_token');
    if (!token) return;
    try {
      const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if (payload.admin === true && payload.exp > Math.floor(Date.now()/1000)) {
        // Token masih valid, langsung redirect
        window.location.href = REDIRECT_TO;
      }
    } catch(_) { localStorage.removeItem('admin_token'); }
  })();

  /* ─── TAMPILKAN NOTICE DARI SESSIONSTORAGE (jika dikirim dari halaman lain) ─── */
  const loginNotice = sessionStorage.getItem('login_notice');
  if (loginNotice) {
    showNotice(loginNotice, 'info');
    sessionStorage.removeItem('login_notice');
  }
</script>
</body>
</html>
