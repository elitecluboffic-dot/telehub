<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- SEO -->
  <title>News – TeleBoard</title>
  <meta name="description" content="Berita terbaru, update fitur, dan artikel seputar komunitas Telegram di TeleBoard."/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://telehub.nfy.fyi/news.html"/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://telehub.nfy.fyi/news.html"/>
  <meta property="og:title" content="News – TeleBoard"/>
  <meta property="og:description" content="Berita terbaru, update fitur, dan artikel seputar komunitas Telegram di TeleBoard."/>
  <meta property="og:image" content="https://telehub.nfy.fyi/og-image.png"/>
  <meta property="og:site_name" content="TeleBoard"/>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="70x70" href="/telehub-70.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/telehub-16.png"/>
  <link rel="apple-touch-icon" sizes="57x57" href="/telehub-57.png"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <meta name="theme-color" content="#2196f3"/>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --card: #1c2333; --border: #30363d;
      --accent: #2196f3; --accent2: #00bcd4; --text: #e6edf3; --muted: #8b949e;
      --green: #3fb950; --danger: #f85149; --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

    nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); text-decoration: none; }
    .nav-logo svg { width: 32px; height: 32px; }
    .nav-links { display: flex; gap: 8px; align-items: center; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; padding: 6px 14px; border-radius: 8px; transition: all .2s; }
    .nav-links a:hover { color: var(--text); background: var(--card); }
    .btn { padding: 8px 16px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none; transition: all .2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #1a7fd4; }
    .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-outline:hover { background: var(--accent); color: #fff; }
    .logout-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 12px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; transition: all .2s; }
    .logout-btn:hover { border-color: var(--danger); color: var(--danger); }
    .nav-statistik { background: linear-gradient(90deg, #2196f3, #00bcd4, #3fb950, #f0c040, #2196f3); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: gradientMove 3s linear infinite; font-weight: 600; }
    @keyframes gradientMove { 0%{ background-position: 0% center; } 100%{ background-position: 200% center; } }
    .nav-avatar { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; overflow: hidden; cursor: pointer; }
    .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .page-header { padding: 48px 32px 32px; max-width: 1100px; margin: 0 auto; }
    .page-header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    .page-header p { color: var(--muted); font-size: 0.95rem; }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 32px 60px; }

    /* GRID ARTIKEL */
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-bottom: 40px; }

    .news-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .2s, transform .2s; text-decoration: none; display: flex; flex-direction: column; }
    .news-card:hover { border-color: var(--accent); transform: translateY(-3px); }
    .news-thumb { width: 100%; height: 180px; object-fit: cover; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--muted); }
    .news-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .news-body { padding: 18px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .news-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .news-tag { padding: 2px 10px; border-radius: 99px; background: rgba(33,150,243,.12); color: var(--accent); font-size: 0.7rem; font-weight: 600; letter-spacing: .3px; }
    .news-title { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .news-desc { font-size: 0.83rem; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
    .news-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .news-author { font-size: 0.75rem; color: var(--muted); }
    .news-date { font-size: 0.75rem; color: var(--muted); }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-state h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; margin-bottom: 8px; color: var(--text); }

    /* SKELETON */
    .skeleton-card { height: 320px; border-radius: var(--radius); background: linear-gradient(90deg,var(--surface) 25%,var(--card) 50%,var(--surface) 75%); background-size:200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* LOAD MORE */
    .load-more-wrap { display: flex; justify-content: center; }
    .load-more-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 10px 28px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; transition: all .2s; font-family: 'Inter', sans-serif; }
    .load-more-btn:hover { border-color: var(--accent); color: var(--accent); }
    .load-more-btn:disabled { opacity: .5; cursor: not-allowed; }

    footer { background: var(--surface); border-top: 1px solid var(--border); text-align: center; padding: 28px; color: var(--muted); font-size: 0.85rem; }
    footer a { color: var(--accent); text-decoration: none; }

    @media(max-width: 600px) {
      nav { padding: 12px 16px; }
      .nav-links a:not(.btn) { display: none; }
      .page-header { padding: 32px 16px 20px; }
      .container { padding: 0 16px 40px; }
      .news-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="16" fill="#2196f3"/>
      <path d="M7 16.5l3.5 3.5 9-9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 10l-8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    TeleBoard
  </a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="page-header">
  <h1>📰 News &amp; Artikel</h1>
  <p>Update terbaru, tips, dan artikel seputar komunitas Telegram.</p>
</div>

<div class="container">
  <div class="news-grid" id="newsGrid">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </div>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">Muat Lebih Banyak</button>
  </div>
</div>

<footer>
  &copy; 2025 TeleBoard &mdash; <a href="privacy.html">Kebijakan Privasi</a> · <a href="terms.html">Syarat Layanan</a>
</footer>

<script>
const API_NEWS = 'backend/api_news.php';
let page = 1, total = 0, articles = [];

/* ─── NAV ─── */
function renderNav() {
  const token = localStorage.getItem('token');
  const el = document.getElementById('navLinks');
  if (token) {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const initial = (user.full_name || 'U')[0].toUpperCase();
    const avatarHtml = user.avatar ? `<img src="${user.avatar}" alt="avatar"/>` : initial;
    el.innerHTML = `
      <a href="index.html">Beranda</a>
      <a href="dashboard.html">Dashboard</a>
      <div class="nav-avatar" onclick="window.location.href='dashboard.html'">${avatarHtml}</div>
      <button class="logout-btn" onclick="doLogout()">Keluar</button>`;
  } else {
    el.innerHTML = `
      <a href="index.html">Beranda</a>
      <a href="statistik.html" class="nav-statistik">Statistik</a>
      <a href="login.html" class="btn btn-outline">Masuk</a>
      <a href="register.html" class="btn btn-primary">Daftar</a>`;
  }
}

function doLogout() {
  if (!confirm('Yakin ingin keluar?')) return;
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = 'index.html';
}

/* ─── LOAD ARTICLES ─── */
async function loadArticles(reset = true) {
  if (reset) { page = 1; articles = []; }
  try {
    const r = await fetch(`${API_NEWS}?action=get_articles&page=${page}&per_page=9`);
    const d = await r.json();
    if (!d.success) throw new Error();
    total    = d.total;
    articles = reset ? d.articles : articles.concat(d.articles);
    renderArticles();
    updateLoadMore();
  } catch(e) {
    document.getElementById('newsGrid').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="icon">⚠️</div>
        <h2>Gagal memuat artikel</h2>
        <p>Coba muat ulang halaman.</p>
      </div>`;
  }
}

function loadMore() {
  page++;
  document.getElementById('loadMoreBtn').disabled = true;
  document.getElementById('loadMoreBtn').textContent = 'Memuat...';
  loadArticles(false);
}

function updateLoadMore() {
  const wrap = document.getElementById('loadMoreWrap');
  if (articles.length < total) {
    wrap.style.display = 'flex';
    document.getElementById('loadMoreBtn').disabled = false;
    document.getElementById('loadMoreBtn').textContent = 'Muat Lebih Banyak';
  } else {
    wrap.style.display = 'none';
  }
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function renderArticles() {
  const grid = document.getElementById('newsGrid');
  if (!articles.length) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="icon">📭</div>
        <h2>Belum ada artikel</h2>
        <p>Kirim artikel pertamamu lewat halaman <a href="submit-artikel.html">Kirim Artikel</a>.</p>
      </div>`;
    return;
  }

  grid.innerHTML = articles.map(a => {
    const tags = (a.tags || '').split(',').filter(Boolean);
    const tagsHtml = tags.map(t => `<span class="news-tag">${escHtml(t.trim())}</span>`).join('');
    const thumbHtml = a.thumbnail
      ? `<div class="news-thumb"><img src="${escHtml(a.thumbnail)}" alt="${escHtml(a.title)}" loading="lazy"/></div>`
      : `<div class="news-thumb">📰</div>`;
    return `
      <a href="artikel.html?slug=${encodeURIComponent(a.slug)}" class="news-card">
        ${thumbHtml}
        <div class="news-body">
          ${tagsHtml ? `<div class="news-tags">${tagsHtml}</div>` : ''}
          <div class="news-title">${escHtml(a.title)}</div>
          <div class="news-desc">${escHtml(a.description)}</div>
          <div class="news-meta">
            <span class="news-author">✍️ ${escHtml(a.author)}</span>
            <span class="news-date">📅 ${escHtml(a.date_fmt || a.date)}</span>
          </div>
        </div>
      </a>`;
  }).join('');
}

/* ─── TRACK VISIT ─── */
async function trackVisit() {
  try {
    const r = await fetch('backend/api_visitor.php?action=track_visit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        page: 'news.html',
        referrer: document.referrer || 'direct',
        ua: navigator.userAgent,
        lang: navigator.language,
        screen: `${screen.width}x${screen.height}`
      })
    });
    const d = await r.json();
    if (d.success && d.visit_id) {
      const startTime = Date.now();
      const sendDuration = () => navigator.sendBeacon(
        'backend/api_visitor.php?action=track_visit_duration',
        JSON.stringify({ visit_id: d.visit_id, duration: Math.round((Date.now() - startTime) / 1000) })
      );
      window.addEventListener('pagehide', sendDuration);
      window.addEventListener('beforeunload', sendDuration);
    }
  } catch(e) {}
}

renderNav();
loadArticles();
trackVisit();
</script>
</body>
</html>
