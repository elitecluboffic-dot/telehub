<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tambah Server – TeleBoard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
    
  <!-- ═══ FAVICON ═══ -->
  <link rel="icon" type="image/png" sizes="70x70" href="/telehub-70.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/telehub-16.png"/>
  <link rel="icon" type="image/png" sizes="72x72" href="/telehub-72.png"/>
  <link rel="apple-touch-icon" sizes="57x57" href="/telehub-57.png"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <meta name="theme-color" content="#2196f3"/>    
    
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --card:#1c2333;
    --border:#30363d; --accent:#2196f3; --accent2:#00bcd4;
    --text:#e6edf3; --muted:#8b949e; --green:#3fb950;
    --star:#f0c040; --danger:#f85149; --warn:#f0a040; --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  a{color:inherit;}

  /* ── NAV FIXED ── */
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 32px;
    height:58px;
    min-height:58px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:100;
    gap:12px;
    overflow:hidden;
  }
  .nav-logo{
    display:flex;align-items:center;gap:10px;
    font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;
    color:var(--accent);text-decoration:none;flex-shrink:0;white-space:nowrap;
  }
  .nav-logo svg{width:32px;height:32px;flex-shrink:0;}
  .nav-right{
    display:flex;align-items:center;gap:8px;flex-shrink:0;
  }
  .nav-links-text{display:flex;align-items:center;gap:4px;}
  .nav-links-text a{
    color:var(--muted);text-decoration:none;font-size:0.88rem;
    padding:6px 12px;border-radius:8px;transition:all .2s;white-space:nowrap;
  }
  .nav-links-text a:hover{color:var(--text);background:var(--card);}
  .nav-avatar{
    width:34px;height:34px;border-radius:50%;
    border:2px solid var(--accent);background:var(--card);
    display:flex;align-items:center;justify-content:center;
    font-size:0.85rem;overflow:hidden;cursor:pointer;flex-shrink:0;
  }
  .nav-avatar img{width:100%;height:100%;object-fit:cover;}
  .logout-btn{
    background:none;border:1px solid var(--border);color:var(--muted);
    padding:6px 12px;border-radius:8px;font-size:0.82rem;
    cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;
    font-family:'Inter',sans-serif;
  }
  .logout-btn:hover{border-color:var(--danger);color:var(--danger);}
  .btn{padding:8px 18px;border-radius:8px;font-size:0.9rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#1a7fd4;}
  .btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  .btn-outline:hover{background:var(--accent);color:#fff;}

  .container{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}
  .breadcrumb{font-size:0.84rem;color:var(--muted);margin-bottom:18px;}
  .breadcrumb a{color:var(--muted);text-decoration:none;}
  .breadcrumb a:hover{color:var(--accent);}
  .page-head{margin-bottom:24px;}
  .page-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.8rem;margin-bottom:6px;}
  .page-sub{color:var(--muted);font-size:0.9rem;}

  /* STEPPER */
  .stepper{display:flex;align-items:center;margin-bottom:28px;max-width:560px;}
  .step{display:flex;flex-direction:column;align-items:center;flex:1;}
  .step-circle{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;color:var(--muted);transition:all .3s;position:relative;z-index:1;}
  .step.active .step-circle{border-color:var(--accent);background:var(--accent);color:#fff;}
  .step.done .step-circle{border-color:var(--green);background:var(--green);color:#fff;}
  .step-label{font-size:0.7rem;color:var(--muted);margin-top:5px;text-align:center;}
  .step.active .step-label{color:var(--accent);}
  .step.done .step-label{color:var(--green);}
  .step-line{flex:1;height:2px;background:var(--border);margin-top:-16px;transition:background .3s;}
  .step-line.done{background:var(--green);}

  .layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;}

  .section-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;}
  .section-head{padding:16px 22px;border-bottom:1px solid var(--border);}
  .section-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:0.95rem;display:flex;align-items:center;gap:8px;}
  .section-desc{font-size:0.8rem;color:var(--muted);margin-top:3px;}
  .section-body{padding:22px;}

  .form-group{margin-bottom:20px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  label{display:block;font-size:0.85rem;font-weight:500;color:var(--text);margin-bottom:7px;}
  label .opt{color:var(--muted);font-weight:400;font-size:0.78rem;}
  .hint{font-size:0.76rem;color:var(--muted);margin-top:6px;line-height:1.5;}
  input[type=text],input[type=url],input[type=number],textarea{
    width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:0.93rem;padding:11px 14px;outline:none;transition:border-color .2s;
    font-family:'Inter',sans-serif;
  }
  input:focus,textarea:focus{border-color:var(--accent);}
  input.error,textarea.error{border-color:var(--danger);}
  textarea{resize:vertical;min-height:120px;line-height:1.6;}
  .field-error{font-size:0.76rem;color:var(--danger);margin-top:6px;display:none;}
  .field-error.show{display:block;}
  .char-count{font-size:0.74rem;color:var(--muted);text-align:right;margin-top:6px;}
  .char-count.warn{color:var(--warn);}

  .avatar-picker{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .avatar-preview{width:72px;height:72px;border-radius:18px;background:var(--surface);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;overflow:hidden;}
  .avatar-preview img{width:100%;height:100%;object-fit:cover;}
  .avatar-tabs{display:flex;gap:8px;margin-bottom:10px;}
  .avatar-tab{padding:6px 14px;border-radius:8px;font-size:0.8rem;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:var(--surface);transition:all .2s;}
  .avatar-tab.active{border-color:var(--accent);color:var(--accent);background:rgba(33,150,243,.1);}
  .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:340px;}
  .emoji-opt{aspect-ratio:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;transition:all .2s;}
  .emoji-opt:hover{border-color:var(--accent);}
  .emoji-opt.active{border-color:var(--accent);background:rgba(33,150,243,.15);}
  .upload-btn{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:0.84rem;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
  .upload-btn:hover{border-color:var(--accent);color:var(--accent);}

  .tag-grid{display:flex;gap:8px;flex-wrap:wrap;}
  .tag-opt{padding:8px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:0.83rem;cursor:pointer;transition:all .2s;user-select:none;}
  .tag-opt:hover{border-color:var(--accent);}
  .tag-opt.active{border-color:var(--accent);color:var(--accent);background:rgba(33,150,243,.12);}
  .custom-tag-row{display:flex;gap:8px;margin-top:12px;}
  .custom-tag-row input{flex:1;}
  .custom-tag-row button{padding:0 18px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:0.85rem;cursor:pointer;font-family:'Inter',sans-serif;}
  .custom-tag-row button:hover{border-color:var(--accent);color:var(--accent);}
  .selected-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .sel-tag{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:99px;background:rgba(33,150,243,.12);color:var(--accent);font-size:0.78rem;font-weight:600;}
  .sel-tag .rm{cursor:pointer;width:16px;height:16px;border-radius:50%;background:rgba(33,150,243,.25);display:flex;align-items:center;justify-content:center;font-size:0.65rem;}
  .sel-tag .rm:hover{background:var(--danger);color:#fff;}

  .ss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
  .ss-item{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .ss-item img{width:100%;height:100%;object-fit:cover;}
  .ss-remove{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:0.7rem;}
  .ss-add{aspect-ratio:16/10;border-radius:8px;border:1.5px dashed var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:0.78rem;cursor:pointer;transition:all .2s;}
  .ss-add:hover{border-color:var(--accent);color:var(--accent);}

  .terms-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:0.8rem;color:var(--muted);line-height:1.7;max-height:140px;overflow-y:auto;margin-bottom:14px;}
  .check-row{display:flex;align-items:flex-start;gap:10px;}
  .check-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;margin-top:2px;flex-shrink:0;}
  .check-row label{font-size:0.84rem;color:var(--text);cursor:pointer;margin-bottom:0;font-weight:400;}

  .form-nav{display:flex;justify-content:space-between;gap:12px;margin-top:8px;}
  .btn-lg{padding:12px 26px;border-radius:10px;font-size:0.92rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Inter',sans-serif;}
  .btn-lg-primary{background:var(--accent);color:#fff;}
  .btn-lg-primary:hover{background:#1a7fd4;}
  .btn-lg-primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;}
  .btn-lg-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);}
  .btn-lg-secondary:hover{border-color:var(--accent);color:var(--accent);}

  .alert{padding:11px 16px;border-radius:8px;font-size:0.85rem;margin-bottom:18px;display:none;}
  .alert.show{display:block;}
  .alert-error{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);color:var(--danger);}
  .alert-success{background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.3);color:var(--green);}

  .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .preview-col{position:sticky;top:74px;}
  .preview-label{font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .server-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .card-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;}
  .card-avatar{width:52px;height:52px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;border:2px solid var(--border);overflow:hidden;}
  .card-avatar img{width:100%;height:100%;object-fit:cover;}
  .card-info{flex:1;min-width:0;}
  .card-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1rem;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-meta{font-size:0.78rem;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .tag{padding:3px 10px;border-radius:99px;background:rgba(33,150,243,.12);color:var(--accent);font-size:0.72rem;font-weight:600;letter-spacing:.3px;}
  .card-desc{font-size:0.84rem;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:16px;min-height:1.2em;}
  .card-footer{display:flex;align-items:center;justify-content:space-between;}
  .member-count{font-size:0.8rem;color:var(--muted);}
  .join-btn{background:var(--border);color:var(--muted);border:none;padding:8px 18px;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:default;}
  .preview-note{font-size:0.78rem;color:var(--muted);margin-top:12px;line-height:1.6;text-align:center;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:0.86rem;display:flex;align-items:center;gap:10px;z-index:300;transform:translateY(80px);opacity:0;transition:all .3s;max-width:320px;}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast.ok{border-color:var(--green);}
  .toast.err{border-color:var(--danger);}

  .success-wrap{text-align:center;padding:60px 20px;}
  .success-icon{font-size:3.6rem;margin-bottom:16px;}
  .success-title{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:8px;}
  .success-sub{color:var(--muted);font-size:0.92rem;max-width:420px;margin:0 auto 28px;line-height:1.7;}
  .success-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  footer{background:var(--surface);border-top:1px solid var(--border);text-align:center;padding:32px;color:var(--muted);font-size:0.85rem;margin-top:40px;}
  footer a{color:var(--accent);text-decoration:none;}

  /* ══ RESPONSIVE ══ */
  @media(max-width:900px){
    .layout{grid-template-columns:1fr;}
    .preview-col{order:-1;position:static;}
  }
  @media(max-width:768px){
    nav{padding:0 16px;height:52px;min-height:52px;}
    .nav-links-text{display:none;}
    .nav-logo{font-size:1.1rem;}
    .nav-logo svg{width:26px;height:26px;}
    .logout-btn{padding:5px 10px;font-size:0.78rem;}
    .nav-avatar{width:30px;height:30px;}
  }
  @media(max-width:480px){
    .container{padding:16px 12px 40px;}
    .section-body{padding:16px 14px;}
    .form-row{grid-template-columns:1fr;}
    .page-title{font-size:1.4rem;}
    .emoji-grid{grid-template-columns:repeat(6,1fr);}
    .form-nav{flex-direction:column-reverse;gap:10px;}
    .form-nav .btn-lg{width:100%;text-align:center;justify-content:center;}
    .btn-lg{padding:11px 16px;font-size:0.88rem;}
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="16" fill="#2196f3"/>
      <path d="M7 16.5l3.5 3.5 9-9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 10l-8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    TeleBoard
  </a>
  <div class="nav-right">
    <div class="nav-links-text" id="navLinksText"></div>
    <div id="navAvatarWrap"></div>
    <button class="logout-btn" onclick="doLogout()">Keluar</button>
  </div>
</nav>

<div class="container">
  <div class="breadcrumb"><a href="index.html">Beranda</a> / <a href="dashboard.html">Dashboard</a> / Tambah Server</div>
  <div id="pageRoot"></div>
</div>

<footer>
  &copy; 2025 TeleBoard &mdash; <a href="#">Kebijakan Privasi</a> &middot; <a href="#">Syarat Layanan</a> &middot; <a href="#">Kontak</a>
</footer>

<div class="toast" id="toast"></div>

<script>
const API = 'https://telehub.nfy.fyi/backend/api.php';
const AVAILABLE_TAGS = ['gaming','anime','crypto','music','tech','nft','edukasi','bisnis','olahraga','komunitas'];
const EMOJI_OPTIONS = ['📡','🚀','🌌','🎮','🎌','💰','🎵','💻','🖼️','☕','📈','🎨','⚡','🌐','🔥','🧠','🛰️','🎯','🐉','🍀','🎬','📚','⚽','🧩'];

let state = { avatarMode:'emoji', avatarEmoji:'📡', avatarImage:null, tags:[], screenshots:[] };
let currentUser = null;

window.onload = () => {
  const token = localStorage.getItem('token');
  if (!token) { window.location.href = 'login.html'; return; }
  currentUser = JSON.parse(localStorage.getItem('user') || '{}');
  renderNav();
  renderForm();
};

function renderNav() {
  const initial = (currentUser.full_name || 'U')[0].toUpperCase();
  const avatarHtml = currentUser.avatar
    ? `<img src="${currentUser.avatar}" alt="avatar"/>`
    : initial;
  document.getElementById('navLinksText').innerHTML =
    `<a href="index.html">Beranda</a><a href="dashboard.html">Dashboard</a>`;
  document.getElementById('navAvatarWrap').innerHTML =
    `<div class="nav-avatar" onclick="window.location.href='dashboard.html'" title="Dashboard">${avatarHtml}</div>`;
}

function doLogout() {
  if (!confirm('Yakin ingin keluar?')) return;
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = 'index.html';
}

function renderForm() {
  document.getElementById('pageRoot').innerHTML = `
    <div class="page-head">
      <div class="page-title">📡 Tambah Server Telegram</div>
      <div class="page-sub">Daftarkan server Telegram-mu agar ditemukan ribuan pengguna TeleBoard.</div>
    </div>

    <div class="stepper">
      <div class="step active" id="hs1"><div class="step-circle">1</div><div class="step-label">Detail Server</div></div>
      <div class="step-line" id="hline1"></div>
      <div class="step" id="hs2"><div class="step-circle">2</div><div class="step-label">Media</div></div>
      <div class="step-line" id="hline2"></div>
      <div class="step" id="hs3"><div class="step-circle">3</div><div class="step-label">Konfirmasi</div></div>
    </div>

    <div class="alert alert-error" id="formAlert"></div>

    <div class="layout">
      <div class="main-col">

        <!-- STEP 1 -->
        <div id="formStep1">
          <div class="section-card">
            <div class="section-head">
              <div class="section-title">🪪 Identitas Server</div>
              <div class="section-desc">Informasi dasar yang akan dilihat pengguna lain.</div>
            </div>
            <div class="section-body">
              <div class="form-group">
                <label>Ikon Server</label>
                <div class="avatar-tabs">
                  <div class="avatar-tab active" id="tabEmoji" onclick="switchAvatarMode('emoji')">😀 Pilih Emoji</div>
                  <div class="avatar-tab" id="tabUpload" onclick="switchAvatarMode('upload')">🖼️ Unggah Gambar</div>
                </div>
                <div class="avatar-picker">
                  <div class="avatar-preview" id="avatarPreview">📡</div>
                  <div id="avatarPickerBody" style="flex:1;min-width:200px;"></div>
                </div>
                <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="onAvatarUpload(event)"/>
              </div>

              <div class="form-group">
                <label>Nama Server <span class="opt">*</span></label>
                <input type="text" id="f_name" placeholder="cth. Komunitas Developer Indonesia" maxlength="60" oninput="updatePreview()"/>
                <div class="field-error" id="err_name">Nama server minimal 3 karakter.</div>
              </div>

              <div class="form-group">
                <label>Link Invite Telegram <span class="opt">*</span></label>
                <input type="url" id="f_link" placeholder="https://t.me/namaservermu" oninput="updatePreview()"/>
                <div class="hint">Gunakan link invite publik, contoh: https://t.me/teleboard</div>
                <div class="field-error" id="err_link">Masukkan link Telegram yang valid (https://t.me/...).</div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label>Perkiraan Jumlah Member <span class="opt">*</span></label>
                  <input type="number" id="f_members" placeholder="cth. 1500" min="1" oninput="updatePreview()"/>
                  <div class="field-error" id="err_members">Masukkan jumlah member yang valid.</div>
                </div>
                <div class="form-group">
                  <label>Bahasa Utama</label>
                  <input type="text" id="f_lang" placeholder="cth. Indonesia" maxlength="30" value="Indonesia"/>
                </div>
              </div>

              <div class="form-group" style="margin-bottom:0;">
                <label>Deskripsi Server <span class="opt">*</span></label>
                <textarea id="f_desc" placeholder="Ceritakan tentang server-mu: topik bahasan, aturan, keunikan, dll." maxlength="500" oninput="updatePreview()"></textarea>
                <div class="char-count" id="descCount">0 / 500 karakter</div>
                <div class="field-error" id="err_desc">Deskripsi minimal 20 karakter.</div>
              </div>
            </div>
          </div>

          <div class="section-card">
            <div class="section-head">
              <div class="section-title">🏷️ Kategori &amp; Tag</div>
              <div class="section-desc">Pilih hingga 5 tag agar server lebih mudah ditemukan.</div>
            </div>
            <div class="section-body">
              <div class="tag-grid" id="tagGrid"></div>
              <div class="custom-tag-row">
                <input type="text" id="customTagInput" placeholder="Tambah tag custom..." maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomTag();}"/>
                <button onclick="addCustomTag()">+ Tambah</button>
              </div>
              <div class="selected-tags" id="selectedTags"></div>
              <div class="field-error" id="err_tags">Pilih minimal 1 tag.</div>
            </div>
          </div>

          <div class="form-nav">
            <a href="dashboard.html" class="btn-lg btn-lg-secondary">&#8592; Batal</a>
            <button class="btn-lg btn-lg-primary" onclick="goToStep(2)">Lanjut &#8594;</button>
          </div>
        </div>

        <!-- STEP 2 -->
        <div id="formStep2" style="display:none;">
          <div class="section-card">
            <div class="section-head">
              <div class="section-title">🖼️ Tangkapan Layar <span style="font-weight:400;font-size:.78rem;color:var(--muted);">(opsional, maks. 4)</span></div>
              <div class="section-desc">Tampilkan suasana server-mu agar lebih menarik.</div>
            </div>
            <div class="section-body">
              <div class="ss-grid" id="ssGrid">
                <div class="ss-add" onclick="document.getElementById('ssFileInput').click()">
                  <span style="font-size:1.4rem;">+</span>
                  <span>Tambah Gambar</span>
                </div>
              </div>
              <input type="file" id="ssFileInput" accept="image/*" multiple style="display:none" onchange="onScreenshotUpload(event)"/>
            </div>
          </div>
          <div class="form-nav">
            <button class="btn-lg btn-lg-secondary" onclick="goToStep(1)">&#8592; Kembali</button>
            <button class="btn-lg btn-lg-primary" onclick="goToStep(3)">Lanjut &#8594;</button>
          </div>
        </div>

        <!-- STEP 3 -->
        <div id="formStep3" style="display:none;">
          <div class="section-card">
            <div class="section-head">
              <div class="section-title">&#9989; Konfirmasi &amp; Kirim</div>
              <div class="section-desc">Periksa kembali sebelum mengirim server untuk ditinjau.</div>
            </div>
            <div class="section-body">
              <div class="terms-box">
                <strong>Syarat &amp; Ketentuan Pendaftaran Server</strong><br/><br/>
                1. Server tidak boleh mengandung konten ilegal, perjudian tanpa izin, atau materi dewasa.<br/>
                2. Pemilik bertanggung jawab atas seluruh konten yang dibagikan di server.<br/>
                3. TeleBoard berhak menghapus listing tanpa pemberitahuan jika melanggar ketentuan.<br/>
                4. Link invite harus aktif dan dapat diakses publik.<br/>
                5. Data jumlah member wajib diisi sesuai kondisi sebenarnya.
              </div>
              <div class="check-row">
                <input type="checkbox" id="f_agree"/>
                <label for="f_agree">Saya telah membaca dan menyetujui syarat &amp; ketentuan di atas.</label>
              </div>
              <div class="field-error" id="err_agree">Kamu harus menyetujui syarat &amp; ketentuan.</div>
            </div>
          </div>
          <div class="form-nav">
            <button class="btn-lg btn-lg-secondary" onclick="goToStep(2)">&#8592; Kembali</button>
            <button class="btn-lg btn-lg-primary" id="submitBtn" onclick="submitServer()">&#128640; Kirim Server</button>
          </div>
        </div>

      </div>

      <div class="preview-col">
        <div class="preview-label">&#128065;&#65039; Pratinjau Tampilan Kartu</div>
        <div class="server-card">
          <div class="card-top">
            <div class="card-avatar" id="prevAvatar">📡</div>
            <div class="card-info">
              <div class="card-name" id="prevName">Nama Server Kamu</div>
              <div class="card-meta"><span class="online-dot"></span><span id="prevMembers">0</span> member</div>
            </div>
          </div>
          <div class="card-tags" id="prevTags"></div>
          <div class="card-desc" id="prevDesc">Deskripsi server akan muncul di sini...</div>
          <div class="card-footer">
            <div class="member-count">&#9650; Vote (0)</div>
            <button class="join-btn">JOIN &#8594;</button>
          </div>
        </div>
        <div class="preview-note">Beginilah kartu server-mu akan terlihat di direktori TeleBoard.</div>
      </div>
    </div>
  `;
  buildAvatarPicker();
  buildTagGrid();
  updatePreview();
}

function goToStep(n) {
  if (n === 2 && !validateStep1()) return;
  if (n === 3 && !validateStep1()) { goToStep(1); return; }
  ['1','2','3'].forEach(i => {
    document.getElementById('formStep'+i).style.display = (i == n) ? 'block' : 'none';
  });
  for (let i = 1; i <= 3; i++) {
    const s = document.getElementById('hs'+i);
    s.className = 'step';
    if (i < n) s.classList.add('done');
    else if (i == n) s.classList.add('active');
  }
  for (let i = 1; i <= 2; i++) {
    document.getElementById('hline'+i).className = 'step-line' + (i < n ? ' done' : '');
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

function switchAvatarMode(mode) {
  state.avatarMode = mode;
  document.getElementById('tabEmoji').classList.toggle('active', mode === 'emoji');
  document.getElementById('tabUpload').classList.toggle('active', mode === 'upload');
  buildAvatarPicker();
  updatePreview();
}

function buildAvatarPicker() {
  const body = document.getElementById('avatarPickerBody');
  if (state.avatarMode === 'emoji') {
    body.innerHTML = `<div class="emoji-grid">${EMOJI_OPTIONS.map(e =>
      `<div class="emoji-opt ${e===state.avatarEmoji?'active':''}" onclick="pickEmoji('${e}')">${e}</div>`
    ).join('')}</div>`;
  } else {
    body.innerHTML = `<button class="upload-btn" onclick="document.getElementById('avatarFileInput').click()">Pilih Gambar</button>
      <div class="hint">Format JPG/PNG, rasio 1:1 disarankan.</div>`;
  }
}

function pickEmoji(e) {
  state.avatarEmoji = e;
  document.getElementById('avatarPreview').textContent = e;
  buildAvatarPicker();
  updatePreview();
}

function onAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    state.avatarImage = ev.target.result;
    state.avatarMode = 'upload';
    document.getElementById('avatarPreview').innerHTML = `<img src="${state.avatarImage}" alt="avatar"/>`;
    updatePreview();
  };
  reader.readAsDataURL(file);
}

function buildTagGrid() {
  document.getElementById('tagGrid').innerHTML = AVAILABLE_TAGS.map(t =>
    `<div class="tag-opt" data-tag="${t}" onclick="toggleTag('${t}')">${tagEmoji(t)} ${capitalize(t)}</div>`
  ).join('');
}
function tagEmoji(t) {
  const map = {gaming:'🎮',anime:'🎌',crypto:'💰',music:'🎵',tech:'💻',nft:'🖼️',edukasi:'📚',bisnis:'💼',olahraga:'⚽',komunitas:'👥'};
  return map[t] || '🏷️';
}
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function toggleTag(t) {
  const idx = state.tags.indexOf(t);
  if (idx >= 0) { state.tags.splice(idx, 1); }
  else { if (state.tags.length >= 5) { toast('Maksimal 5 tag.', 'err'); return; } state.tags.push(t); }
  syncTagUI();
}
function addCustomTag() {
  const input = document.getElementById('customTagInput');
  let val = input.value.trim().toLowerCase().replace(/\s+/g, '-');
  if (!val) return;
  if (state.tags.length >= 5) { toast('Maksimal 5 tag.', 'err'); return; }
  if (!state.tags.includes(val)) state.tags.push(val);
  input.value = '';
  syncTagUI();
}
function removeTag(t) { state.tags = state.tags.filter(x => x !== t); syncTagUI(); }
function syncTagUI() {
  document.querySelectorAll('.tag-opt').forEach(el => {
    el.classList.toggle('active', state.tags.includes(el.dataset.tag));
  });
  document.getElementById('selectedTags').innerHTML = state.tags.map(t =>
    `<div class="sel-tag">${tagEmoji(t)} ${capitalize(t)}<span class="rm" onclick="removeTag('${t}')">x</span></div>`
  ).join('');
  if (state.tags.length) document.getElementById('err_tags').classList.remove('show');
  updatePreview();
}

function onScreenshotUpload(event) {
  const files = Array.from(event.target.files);
  if (state.screenshots.length + files.length > 4) toast('Maksimal 4 gambar.', 'err');
  files.slice(0, 4 - state.screenshots.length).forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => { state.screenshots.push(ev.target.result); renderScreenshots(); };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}
function removeScreenshot(i) { state.screenshots.splice(i, 1); renderScreenshots(); }
function renderScreenshots() {
  const grid = document.getElementById('ssGrid');
  const items = state.screenshots.map((src, i) =>
    `<div class="ss-item"><img src="${src}" alt="ss"/><button class="ss-remove" onclick="removeScreenshot(${i})">x</button></div>`
  ).join('');
  const addBtn = state.screenshots.length < 4
    ? `<div class="ss-add" onclick="document.getElementById('ssFileInput').click()"><span style="font-size:1.4rem;">+</span><span>Tambah</span></div>`
    : '';
  grid.innerHTML = items + addBtn;
}

function validateStep1() {
  let ok = true;
  const name = document.getElementById('f_name').value.trim();
  const link = document.getElementById('f_link').value.trim();
  const members = document.getElementById('f_members').value.trim();
  const desc = document.getElementById('f_desc').value.trim();
  toggleFieldError('f_name','err_name', name.length < 3); if (name.length < 3) ok = false;
  const linkValid = /^https?:\/\/(t\.me|telegram\.me)\/[A-Za-z0-9_+]{3,}/.test(link);
  toggleFieldError('f_link','err_link', !linkValid); if (!linkValid) ok = false;
  const membersValid = members && parseInt(members) > 0;
  toggleFieldError('f_members','err_members', !membersValid); if (!membersValid) ok = false;
  toggleFieldError('f_desc','err_desc', desc.length < 20); if (desc.length < 20) ok = false;
  const tagsOk = state.tags.length > 0;
  document.getElementById('err_tags').classList.toggle('show', !tagsOk);
  if (!tagsOk) ok = false;
  if (!ok) showFormAlert('Mohon lengkapi data dengan benar sebelum melanjutkan.');
  return ok;
}
function toggleFieldError(inputId, errId, isError) {
  document.getElementById(inputId).classList.toggle('error', isError);
  document.getElementById(errId).classList.toggle('show', isError);
}
function showFormAlert(msg) {
  const el = document.getElementById('formAlert');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

document.addEventListener('input', e => {
  if (e.target && e.target.id === 'f_desc') {
    const len = e.target.value.length;
    const counter = document.getElementById('descCount');
    if (counter) { counter.textContent = `${len} / 500 karakter`; counter.classList.toggle('warn', len > 450); }
  }
});

function updatePreview() {
  const name = document.getElementById('f_name')?.value.trim() || 'Nama Server Kamu';
  const members = document.getElementById('f_members')?.value || '0';
  const desc = document.getElementById('f_desc')?.value.trim() || 'Deskripsi server akan muncul di sini...';
  document.getElementById('prevName').textContent = name;
  document.getElementById('prevMembers').textContent = parseInt(members||0).toLocaleString();
  document.getElementById('prevDesc').textContent = desc;
  const avatarEl = document.getElementById('prevAvatar');
  if (state.avatarMode === 'upload' && state.avatarImage) {
    avatarEl.innerHTML = `<img src="${state.avatarImage}" alt="avatar"/>`;
  } else {
    avatarEl.textContent = state.avatarEmoji;
  }
  document.getElementById('prevTags').innerHTML = state.tags.map(t =>
    `<span class="tag">${t.toUpperCase()}</span>`
  ).join('');
}

async function submitServer() {
  if (!validateStep1()) { goToStep(1); return; }
  const agree = document.getElementById('f_agree').checked;
  document.getElementById('err_agree').classList.toggle('show', !agree);
  if (!agree) { showFormAlert('Kamu harus menyetujui syarat & ketentuan.'); return; }

  const payload = {
    name: document.getElementById('f_name').value.trim(),
    telegram_link: document.getElementById('f_link').value.trim(),
    members: parseInt(document.getElementById('f_members').value),
    language: document.getElementById('f_lang').value.trim(),
    description: document.getElementById('f_desc').value.trim(),
    tags: state.tags,
    avatar: state.avatarMode === 'upload' ? state.avatarImage : state.avatarEmoji,
    screenshots: state.screenshots
  };

  const btn = document.getElementById('submitBtn');
  btn.innerHTML = '<span class="spinner"></span>Mengirim...';
  btn.disabled = true;

  try {
    const token = localStorage.getItem('token');
    if (!token) { showFormAlert('Token tidak ditemukan. Silakan login kembali.'); btn.innerHTML = 'Kirim Server'; btn.disabled = false; return; }
    const r = await fetch(`${API}?action=add_server`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    if (d.success) { renderSuccess(); return; }
    else showFormAlert(d.message || 'Gagal mengirim server. Coba lagi.');
  } catch (error) {
    showFormAlert('Terjadi kesalahan: ' + error.message);
  }
  btn.innerHTML = 'Kirim Server';
  btn.disabled = false;
}

function renderSuccess() {
  document.getElementById('pageRoot').innerHTML = `
    <div class="section-card">
      <div class="success-wrap">
        <div class="success-icon">🎉</div>
        <div class="success-title">Server Berhasil Dikirim!</div>
        <div class="success-sub">Server-mu sedang ditinjau oleh tim TeleBoard dan akan tayang di direktori dalam waktu singkat. Kamu bisa memantau statusnya dari dashboard.</div>
        <div class="success-actions">
          <a href="dashboard.html" class="btn btn-primary">Ke Dashboard</a>
          <a href="index.html" class="btn btn-outline">Jelajahi Server Lain</a>
        </div>
      </div>
    </div>`;
}

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
